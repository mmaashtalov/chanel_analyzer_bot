name: channel-analyzer-bot

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osint}
      POSTGRES_USER: ${POSTGRES_USER:-channel_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-product-database-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-channel_analyzer} -d ${POSTGRES_DB:-osint}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - product_internal

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-setup}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8080
      PRODUCT_CONFIG_DIR: /data/config
      PRODUCT_RUNTIME_DIR: /data/runtime
      REPORTS_DIR: /data/reports
      DATA_DIR: /data
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-channel_analyzer}:${POSTGRES_PASSWORD:-local-product-database-only}@db:5432/${POSTGRES_DB:-osint}
      OWNER_GATE_PASSWORD: ${OWNER_GATE_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CONTROL_CENTER_PORT:-8080}:8080"
    volumes:
      - reports:/data/reports
      - product_config:/data/config
      - runtime_data:/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - product_internal

volumes:
  postgres_data:
  reports:
  product_config:
  runtime_data:

networks:
  product_internal:
    driver: bridge
