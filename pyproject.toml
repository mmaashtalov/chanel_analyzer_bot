[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-osint-platform"
version = "0.24.0"
description = "Telegram-first OSINT analytics and channel profiling platform"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot==22.8",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy==2.0.51",
  "asyncpg>=0.30,<1",
  "pgvector>=0.3.6,<1",
  "alembic>=1.16,<2",
  "telethon>=1.42,<2",
  "structlog>=25.4,<26",
  "orjson>=3.11,<4",
  "tenacity>=9.1,<10",
  "numpy>=2.3,<3",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
