services:
  demo:
    build: .
    environment:
      APP_MODE: demo
      PORT: 8000
    ports:
      - "8000:8000"
    command: ["python", "-m", "app.entrypoint"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
