services:
  - type: web
    name: chanel-analyzer-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: setup
      - key: PORT
        value: 8080
      - key: PRODUCT_CONFIG_DIR
        value: /data/config
    disk:
      name: chanel-analyzer-data
      mountPath: /data
      sizeGB: 1
