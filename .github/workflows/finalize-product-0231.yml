name: Finalize product release 0.23.1

on:
  push:
    paths:
      - .github/workflows/finalize-product-0231.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*)"0\.23\.0"\s*$',
              r'\1"0.23.1"',
              text,
              count=1,
          )
          if count == 0 and 'version = "0.23.1"' not in text:
              raise SystemExit("Expected product version was not found in pyproject.toml")
          pyproject.write_text(updated, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          if changelog.exists():
              current = changelog.read_text(encoding="utf-8")
              heading = "## 0.23.1 - Secure Product Deployment"
              if heading not in current:
                  entry = '''\n## 0.23.1 - Secure Product Deployment\n\n- Materialized the complete source tree in GitHub.\n- Published the public guided emulator through GitHub Pages.\n- Added a production owner-gate in front of the Control Center.\n- Protected all management routes while keeping health/readiness and emulator public.\n- Added one-click Render configuration with a required owner password.\n- Added owner-gate unit and HTTP integration tests.\n'''
                  changelog.write_text(current.rstrip() + "\n" + entry, encoding="utf-8")
          PY

      - name: Run release checks
        run: |
          python -m compileall -q app
          python -m pytest -q

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/finalize-product-0231.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release already finalized"
            exit 0
          fi
          git commit -m "Release v0.23.1 secure product deployment"
          git push origin HEAD:main
