name: Finalize production integration artifacts

on:
  push:
    branches:
      - agent/production-integration
    paths:
      - .github/workflows/finalize-production-integration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-production-integration
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: agent/production-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Remove one-shot workflow before packaging
        run: rm .github/workflows/finalize-production-integration.yml

      - name: Build reproducible archive and update archive lock
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release_archive.py
          archive_hash="$(sha256sum release/chanel_analyzer_bot_product_v0_24_0.tar.gz | awk '{print $1}')"
          ARCHIVE_HASH="$archive_hash" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("scripts/project_preflight.py")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'EXPECTED_ARCHIVE_HASH = "[0-9a-f]{64}"',
              f'EXPECTED_ARCHIVE_HASH = "{os.environ["ARCHIVE_HASH"]}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("archive hash lock was not found")
          path.write_text(updated, encoding="utf-8")
          PY
          echo "archive_sha256=$archive_hash" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate deterministic manifest
        run: python scripts/generate_manifest.py

      - name: Verify release lock
        run: |
          python scripts/generate_manifest.py --check
          python scripts/project_preflight.py
          python -m compileall -q app alembic scripts tests

      - name: Commit finalized artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "release: finalize production-ready 0.24.0 artifacts"
          git push origin HEAD:agent/production-integration
