name: Core CI

on:
  push:
    branches:
      - main
      - productization/source-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PRODUCT_CONFIG_DIR: ${{ runner.temp }}/channel-analyzer-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Check recovery script
        run: python -m ruff check scripts/recover_source_overlay.py
