name: Recover verified product source

on:
  push:
    paths:
      - .github/workflows/recover-source-overlay.yml
      - scripts/recover_source_overlay.py
  pull_request:
    paths:
      - .github/workflows/recover-source-overlay.yml
      - scripts/recover_source_overlay.py
      - release/source_v023/direct_manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-product-source-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate and verify GitHub Release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -rf .recovery-release
          mkdir -p .recovery-release
          gh release download v0.23.1 \
            --pattern 'chanel_analyzer_bot-0.23.1.tar.xz' \
            --pattern 'SHA256SUMS' \
            --dir .recovery-release
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "GitHub Release v0.23.1 is unavailable; recovery script will try historical sources"
            exit 0
          fi

          archive="$PWD/.recovery-release/chanel_analyzer_bot-0.23.1.tar.xz"
          sums="$PWD/.recovery-release/SHA256SUMS"
          if [ ! -s "$archive" ] || [ ! -s "$sums" ]; then
            echo "Downloaded release is incomplete"
            exit 0
          fi

          expected=$(awk '$2 ~ /chanel_analyzer_bot-0.23.1.tar.xz$/ {print $1; exit}' "$sums")
          actual=$(sha256sum "$archive" | awk '{print $1}')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "GitHub Release checksum verification failed"
            echo "expected=${expected:-missing} actual=${actual}"
            exit 0
          fi

          echo "Verified GitHub Release archive: ${actual}"
          echo "RECOVERY_ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          echo "RECOVERY_ARCHIVE_SHA256=$actual" >> "$GITHUB_ENV"
          echo "RECOVERY_ARCHIVE_ROOT=chanel_analyzer_bot-0.23.1" >> "$GITHUB_ENV"

      - name: Recover verified source and capture diagnostic
        id: source_recovery
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/recover_source_overlay.py > recovery-output.log 2>&1
          code=$?
          cat recovery-output.log
          {
            echo "exit_code=${code}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
            tail -n 40 recovery-output.log
          } > RECOVERY_DIAGNOSTIC.txt
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate recovered product tree
        if: steps.source_recovery.outputs.exit_code == '0'
        run: |
          test -f pyproject.toml
          test -f app/entrypoint.py
          test -f app/setup/server.py
          python -m compileall -q app

      - name: Commit recovery result to current branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf .recovery-release recovery-output.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No recovery changes to commit"
          else
            git commit -m "Record verified source recovery result"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Fail when recovery is incomplete
        if: steps.source_recovery.outputs.exit_code != '0'
        run: |
          echo "Verified source recovery failed; see RECOVERY_DIAGNOSTIC.txt"
          exit 1
