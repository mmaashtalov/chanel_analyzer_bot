name: Recover verified product source

on:
  push:
    paths:
      - .github/workflows/recover-source-overlay.yml
      - scripts/recover_source_overlay.py
      - release/chanel_analyzer_bot_product_v0_22_0.tar.gz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-product-source-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate and verify repository release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$PWD/release/chanel_analyzer_bot_product_v0_22_0.tar.gz"
          expected="da6794ad2df8a7ae26fc9fbd82207138b319e1f43fa974e1814bbaea07ab24ae"
          test -s "$archive"
          actual=$(sha256sum "$archive" | awk '{print $1}')
          test "$actual" = "$expected"
          echo "Verified repository release archive: $actual"

      - name: Recover verified source and capture diagnostic
        id: source_recovery
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/recover_source_overlay.py > recovery-output.log 2>&1
          code=$?
          cat recovery-output.log
          {
            echo "exit_code=${code}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
            cat recovery-output.log
          } > RECOVERY_DIAGNOSTIC.txt
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate recovered product tree
        if: steps.source_recovery.outputs.exit_code == '0'
        run: |
          test -f pyproject.toml
          test -f app/entrypoint.py
          test -f app/setup/server.py
          python -m compileall -q app

      - name: Commit recovery result to current branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -f recovery-output.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No recovery changes to commit"
          else
            git commit -m "Record verified source recovery result"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Fail when recovery is incomplete
        if: steps.source_recovery.outputs.exit_code != '0'
        run: |
          echo "Verified source recovery failed; see RECOVERY_DIAGNOSTIC.txt"
          exit 1
