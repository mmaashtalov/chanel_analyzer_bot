name: Publish product release v0.23.1

on:
  push:
    paths:
      - .github/workflows/publish-release-0231.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-product-release-0231
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Run regression
        run: |
          python -m compileall -q app
          python -m pytest -q

      - name: Build Docker image
        run: docker build -t chanel-analyzer-bot:0.23.1 .

      - name: Build deterministic release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage/chanel_analyzer_bot-0.23.1
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              release/source_v023/*|release/chunks/*) continue ;;
            esac
            mkdir -p "dist/stage/chanel_analyzer_bot-0.23.1/$(dirname "$file")"
            cp -a "$file" "dist/stage/chanel_analyzer_bot-0.23.1/$file"
          done
          find dist/stage -exec touch -h -d '2026-07-28T00:00:00Z' {} +
          tar --sort=name \
              --mtime='2026-07-28T00:00:00Z' \
              --owner=0 --group=0 --numeric-owner \
              -C dist/stage -cJf dist/chanel_analyzer_bot-0.23.1.tar.xz \
              chanel_analyzer_bot-0.23.1
          sha256sum dist/chanel_analyzer_bot-0.23.1.tar.xz > dist/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse refs/tags/v0.23.1 >/dev/null 2>&1; then
            git tag -a v0.23.1 -m 'Channel Analyzer Bot v0.23.1'
            git push origin v0.23.1
          fi
          if gh release view v0.23.1 >/dev/null 2>&1; then
            gh release upload v0.23.1 \
              dist/chanel_analyzer_bot-0.23.1.tar.xz \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create v0.23.1 \
              dist/chanel_analyzer_bot-0.23.1.tar.xz \
              dist/SHA256SUMS \
              --title 'Channel Analyzer Bot v0.23.1' \
              --notes-file docs/PRODUCT_RELEASE_0.23.1.md \
              --latest
          fi

      - name: Publish container image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag chanel-analyzer-bot:0.23.1 "$image:0.23.1"
          docker tag chanel-analyzer-bot:0.23.1 "$image:latest"
          docker push "$image:0.23.1"
          docker push "$image:latest"
